<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>รายงานสถิติจำนวนพระสงฆ์และวัดในประเทศมาเลเซีย</title>

<!-- TAILWIND -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================
   PAGE
========================= */

@page{
  size:A4 landscape;
  margin:5mm;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#f3f4f6;
  font-family:'Sarabun',sans-serif;
}

/* =========================
   REPORT AREA
========================= */

#reportArea{

  width:277mm;

  background:white;

  margin:auto;

  overflow:visible;

  padding-bottom:4mm;
}

/* =========================
   HEADER
========================= */

.header{

  background:
    linear-gradient(
      135deg,
      #7c2d12 0%,
      #c2410c 45%,
      #ea580c 100%
    );

  position:relative;

  overflow:hidden;
}

.header::before{

  content:'☸';

  position:absolute;

  right:-25mm;
  top:-18mm;

  font-size:90mm;

  color:rgba(255,255,255,.08);
}

.header-inner{

  position:relative;
  z-index:2;

  padding:7mm 10mm;

  text-align:center;
}

.header-title{

  color:white;

  font-size:20pt;

  font-weight:900;

  line-height:1.3;

  margin:0;
}

.header-sub{

  color:#ffedd5;

  font-size:11pt;

  margin-top:2mm;

  font-weight:700;
}

/* =========================
   CONTROL
========================= */

.top-control{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:5mm;

  flex-wrap:wrap;

  margin-top:5mm;
}

#yearFilter{

  width:220px;

  height:54px;

  border:none;

  border-radius:16px;

  font-size:22px;

  font-weight:800;

  padding:0 18px;

  background:white;

  color:#1e293b;

  outline:none;
}

.top-btn{

  height:54px;

  border:none;

  border-radius:16px;

  padding:0 28px;

  font-size:18px;

  font-weight:800;

  color:white;

  cursor:pointer;
}

.btn-print{
  background:#2563eb;
}

.btn-pdf{
  background:#dc2626;
}

/* =========================
   KPI
========================= */

.kpi-grid{

  display:grid;

  grid-template-columns:repeat(6,1fr);

  gap:4mm;

  padding:5mm;
}

.kpi-card{

  border:1px solid #e5e7eb;

  border-radius:4mm;

  padding:3mm;

  text-align:center;

  background:white;
}

.kpi-title{

  font-size:10pt;

  font-weight:700;

  color:#64748b;
}

.kpi-value{

  margin-top:2mm;

  font-size:20pt;

  font-weight:900;

  line-height:1;
}

/* =========================
   CHART
========================= */

.chart-wrap{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:4mm;

  padding:0 5mm;
}

.chart-box{

  border:1px solid #e5e7eb;

  border-radius:4mm;

  padding:3mm;

  background:white;

  min-height:58mm;

  overflow:hidden;
}

.chart-title{

  font-size:11pt;

  font-weight:900;

  margin-bottom:2mm;
}

.chart-box canvas{

  width:100% !important;

  height:42mm !important;
}

/* =========================
   TABLE
========================= */

.table-wrap{

  margin:4mm 5mm 0;

  border:1px solid #e5e7eb;

  border-radius:4mm;

  overflow:visible;

  background:white;
}

.table-title{

  padding:3mm 5mm;

  border-bottom:1px solid #e5e7eb;

  font-size:11pt;

  font-weight:900;
}

table{

  width:100%;

  border-collapse:collapse;
}

thead{

  background:#7c2d12;

  color:white;
}

th,td{

  padding:2.2mm;

  text-align:center;

  font-size:9pt;
}

tbody tr:nth-child(even){

  background:#f8fafc;
}

/* =========================
   PRINT
========================= */

@media print{

  html,
  body{

    width:297mm;

    min-height:210mm;

    background:white !important;

    overflow:visible !important;

    -webkit-print-color-adjust:exact !important;

    print-color-adjust:exact !important;
  }

  .no-print{
    display:none !important;
  }

  #reportArea{

    width:277mm;

    overflow:visible !important;

    margin:auto;
  }

  table{
    page-break-inside:auto;
  }

  tr{
    page-break-inside:avoid;
  }

  .table-wrap,
  .chart-box,
  .kpi-card{

    break-inside:avoid;
  }

}

/* =========================
   PDF
========================= */

.pdf-mode #reportArea{

  width:277mm !important;

  overflow:visible !important;
}

</style>
</head>

<body>

<div id="reportArea">

  <!-- HEADER -->

  <div class="header">

    <div class="header-inner">

      <h1 class="header-title">

        รายงานสถิติจำนวนพระสงฆ์และวัดในประเทศมาเลเซีย
        ประจำปี
        <span id="titleYearTH"></span>

      </h1>

      <div class="header-sub">

        Statistical Report of Monks and Temples in Malaysia Year
        <span id="titleYearEN"></span>

      </div>

      <!-- CONTROL -->

      <div class="top-control no-print">

        <select id="yearFilter"></select>

        <button
          class="top-btn btn-print"
          onclick="window.print()"
        >
          🖨️ พิมพ์รายงาน
        </button>

        <button
          class="top-btn btn-pdf"
          onclick="downloadPDF()"
        >
          📄 Export PDF
        </button>

      </div>

    </div>

  </div>

  <!-- KPI -->

  <div class="kpi-grid">

    <div class="kpi-card">
      <div class="kpi-title">🧘 พระทั้งหมด</div>
      <div id="kpiMonks" class="kpi-value text-amber-700">0</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-title">➕ พระเพิ่ม</div>
      <div id="kpiMonkDiff" class="kpi-value text-green-600">0</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-title">📈 % พระ</div>
      <div id="kpiMonkGrowth" class="kpi-value text-purple-600">0%</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-title">🏛️ วัดทั้งหมด</div>
      <div id="kpiTemples" class="kpi-value text-blue-600">0</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-title">➕ วัดเพิ่ม</div>
      <div id="kpiTempleDiff" class="kpi-value text-orange-600">0</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-title">📊 % วัด</div>
      <div id="kpiTempleGrowth" class="kpi-value text-red-600">0%</div>
    </div>

  </div>

  <!-- CHART -->

  <div class="chart-wrap">

    <div class="chart-box">

      <div class="chart-title">
        📈 แนวโน้มจำนวนพระรายปี
      </div>

      <canvas id="monkChart"></canvas>

    </div>

    <div class="chart-box">

      <div class="chart-title">
        🏛️ จำนวนพระแยกรัฐ
      </div>

      <canvas id="stateChart"></canvas>

    </div>

  </div>

  <!-- TABLE -->

  <div class="table-wrap">

    <div class="table-title">
      📋 รายงานแยกรัฐ
    </div>

    <table>

      <thead>

        <tr>

          <th>ลำดับ</th>
          <th>รัฐ</th>
          <th>จำนวนวัด</th>
          <th>จำนวนพระ</th>
          <th>เพิ่มพระ</th>

        </tr>

      </thead>

      <tbody id="stateTable"></tbody>

    </table>

  </div>

</div>

<!-- =========================
   FIREBASE
========================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* FIREBASE */

const app = initializeApp({

  apiKey:"AIzaSyCOX6wT65phG79nSYFcqq40sQ4xTU15rI0",
  authDomain:"sangha-malaysia-db.firebaseapp.com",
  projectId:"sangha-malaysia-db",
  storageBucket:"sangha-malaysia-db.appspot.com",
  messagingSenderId:"113712257853",
  appId:"1:113712257853:web:8b8dc634917aeeb49ac354"

});

const db = getFirestore(app);

/* STATES */

const STATE_ORDER = [
  'เคดาห์',
  'เปอร์ลิส',
  'ปีนัง',
  'เปรัก',
  'สลังงอร์',
  'ยะโฮร์',
  'กลันตัน'
];

const normState = s =>
  (s || '')
  .replace(/^รัฐ/,'')
  .trim();

/* YEAR */

const yearFilter =
  document.getElementById('yearFilter');

const currentYear =
  new Date().getFullYear();

for(
  let y=currentYear;
  y>=currentYear-10;
  y--
){

  const op =
    document.createElement('option');

  op.value = y;

  op.textContent =
    `ปี ${y} / ${y+543}`;

  if(y===currentYear){
    op.selected = true;
  }

  yearFilter.appendChild(op);
}

/* CHART */

let monkChart = null;
let stateChart = null;

/* LOAD */

async function loadDashboard(){

  const selectedYear =
    Number(yearFilter.value);

  document.getElementById('titleYearTH')
    .textContent =
      selectedYear + 543;

  document.getElementById('titleYearEN')
    .textContent =
      selectedYear;

  const snap =
    await getDocs(collection(db,'temples'));

  const yearStats = {};
  const templeYearStats = {};
  const stateStats = {};

  let totalMonks = 0;
  let totalTemples = 0;

  snap.forEach(doc=>{

    totalTemples++;

    const data = doc.data();

    const state =
      normState(data.state);

    if(!stateStats[state]){

      stateStats[state] = {
        temples:0,
        monks:0,
        added:0
      };

    }

    stateStats[state].temples++;

    (data.monks || []).forEach(m=>{

      totalMonks++;

      stateStats[state].monks++;

      const dt =
        m.createdAt?.toDate?.()
        || new Date(m.createdAt);

      if(dt && !isNaN(dt)){

        const y =
          dt.getFullYear();

        if(!yearStats[y]){
          yearStats[y]=0;
        }

        yearStats[y]++;

        if(y===selectedYear){
          stateStats[state].added++;
        }

      }

    });

  });

  /* KPI */

  const prevMonk =
    yearStats[selectedYear - 1] || 0;

  const currentMonk =
    yearStats[selectedYear] || 0;

  const monkDiff =
    currentMonk - prevMonk;

  const monkGrowth =
    prevMonk > 0
    ? ((monkDiff / prevMonk) * 100)
    : 0;

  document.getElementById('kpiMonks')
    .textContent =
      totalMonks.toLocaleString();

  document.getElementById('kpiMonkDiff')
    .textContent =
      `${monkDiff >=0 ? '+' : ''}${monkDiff}`;

  document.getElementById('kpiMonkGrowth')
    .textContent =
      `${monkGrowth.toFixed(1)}%`;

  document.getElementById('kpiTemples')
    .textContent =
      totalTemples.toLocaleString();

  /* TABLE */

  const tbody =
    document.getElementById('stateTable');

  tbody.innerHTML='';

  STATE_ORDER.forEach((state,index)=>{

    const st =
      stateStats[state] || {
        temples:0,
        monks:0,
        added:0
      };

    tbody.innerHTML += `
    <tr>

      <td>${index+1}</td>

      <td>${state}</td>

      <td>${st.temples}</td>

      <td>${st.monks}</td>

      <td style="
        color:#16a34a;
        font-weight:800;
      ">
        +${st.added}
      </td>

    </tr>
    `;
  });

  /* MONK CHART */

  const labels =
    Object.keys(yearStats).sort();

  const values =
    labels.map(y=>yearStats[y]);

  if(monkChart){
    monkChart.destroy();
  }

  monkChart =
    new Chart(
      document.getElementById('monkChart'),
      {
        type:'line',

        data:{
          labels:labels,

          datasets:[{

            label:'จำนวนพระ',

            data:values,

            borderWidth:3,

            tension:.3,

            fill:true

          }]
        },

        options:{
          responsive:true,
          maintainAspectRatio:false
        }
      }
    );

  /* STATE CHART */

  const stateLabels =
    STATE_ORDER;

  const stateData =
    STATE_ORDER.map(
      s => stateStats[s]?.monks || 0
    );

  if(stateChart){
    stateChart.destroy();
  }

  stateChart =
    new Chart(
      document.getElementById('stateChart'),
      {
        type:'bar',

        data:{
          labels:stateLabels,

          datasets:[{

            label:'จำนวนพระ',

            data:stateData,

            borderWidth:1

          }]
        },

        options:{
          responsive:true,
          maintainAspectRatio:false
        }
      }
    );

}

/* START */

loadDashboard();

/* CHANGE YEAR */

yearFilter.addEventListener(
  'change',
  loadDashboard
);

/* PDF */

window.downloadPDF = async function(){

  const element =
    document.getElementById('reportArea');

  await html2pdf()
    .set({

      margin:0,

      filename:
        `Malaysia-Monk-Statistics-${yearFilter.value}.pdf`,

      image:{
        type:'jpeg',
        quality:1
      },

      html2canvas:{
        scale:2,
        useCORS:true
      },

      jsPDF:{
        unit:'mm',
        format:'a4',
        orientation:'landscape'
      },

      pagebreak:{
        mode:['avoid-all']
      }

    })
    .from(element)
    .save();

}

</script>

</body>
</html>
